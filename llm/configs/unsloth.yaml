# No-budget pilot configuration for Unsloth.
# Start small; scale only after MunyarwandaBench improves.
base_model: Qwen/Qwen3-1.7B-Base
method: qlora
load_in_4bit: true
max_seq_length: 2048
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
num_train_epochs: 2
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
packing: true
seed: 42
output_dir: outputs/munyarwanda-qwen3-1.7b-qlora
